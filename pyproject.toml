[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automind-ai"
version = "0.1.0"
description = "Local-first industrial intelligence and reproducible ML experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "celery[redis]>=5.4,<6",
  "python-multipart>=0.0.20", "numpy>=2.0,<3", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "pandera[pandas]>=0.23,<1", "pypdf>=5.4,<7",
  "pillow>=13,<14", "pyyaml>=6.0,<7", "prometheus-client>=0.21,<1",
  "faiss-cpu>=1.10,<2", "httpx>=0.28,<1",
  "xgboost-cpu>=3,<4; platform_system == 'Linux'",
  "xgboost>=3,<4; platform_system != 'Linux'"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "pip-audit>=2.9"]
forecast = ["shap>=0.47,<1"]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=4.51,<5", "datasets>=3.5,<5", "peft>=0.15,<1", "trl==0.27.2", "accelerate>=1.5,<2", "safetensors>=0.5,<1", "timm>=1.0,<2", "sentence-transformers>=4,<6", "mlflow>=3,<4"]
tracking = ["mlflow>=3,<4"]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["automind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["services: requires PostgreSQL and Redis", "ml: optional machine learning dependencies"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_untyped_imports = false
files = ["apps/api/automind/config.py", "apps/api/automind/schemas.py"]
