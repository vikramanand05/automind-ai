# Optional example. Supply automind-runtime Secret with DATABASE_URL and REDIS_URL.
apiVersion: v1
kind: Namespace
metadata: {name: automind}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: artifacts, namespace: automind}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: automind}
spec:
  replicas: 1
  selector: {matchLabels: {app: automind-api}}
  template:
    metadata: {labels: {app: automind-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      initContainers:
        - name: migrate
          image: automind-api:0.1.0
          command: [alembic, upgrade, head]
          envFrom: [{secretRef: {name: automind-runtime}}]
          volumeMounts: [{name: artifacts, mountPath: /app/runtime}]
      containers:
        - name: api
          image: automind-api:0.1.0
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: automind-runtime}}]
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: artifacts, mountPath: /app/runtime}]
      volumes: [{name: artifacts, persistentVolumeClaim: {claimName: artifacts}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: automind}
spec:
  selector: {app: automind-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: automind}
spec:
  replicas: 1
  selector: {matchLabels: {app: automind-web}}
  template:
    metadata: {labels: {app: automind-web}}
    spec:
      containers:
        - name: web
          image: automind-web:0.1.0
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: automind}
spec:
  selector: {app: automind-web}
  ports: [{port: 3000, targetPort: 3000}]
